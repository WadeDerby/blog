{% assign author = site.authors[post.author] %}
<article class="post-card">
  <a href="{{ post.url | absolute_url }}" class="post-card-image-wrap">
    {% if post.image %}
      <img class="post-card-image" src="{% if post.image contains '://' %}{{ post.image }}{% else %}{{ post.image | absolute_url }}{% endif %}" alt="" loading="lazy">
    {% else %}
      <div class="post-card-image-placeholder" style="aspect-ratio:16/10; background:var(--bg-muted); min-height:140px;"></div>
    {% endif %}
  </a>
  <div class="post-card-body">
    <h3 class="post-card-title">
      <a href="{{ post.url | absolute_url }}">{{ post.title }}</a>
    </h3>
    <p class="post-card-excerpt">{{ post.excerpt | strip_html | truncatewords: 24 }}</p>
    <div class="post-card-meta">
      <span class="post-card-date">{{ post.date | date_to_string }}</span>
      <a href="{{ post.url | absolute_url }}" class="post-card-link">Read more →</a>
    </div>
  </div>
</article>
