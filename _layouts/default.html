<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ site.description | default: site.name }}"/>
    <meta name="keywords" content="web dev, frontend, software, blog"/>
    <meta name="robots" content="index,follow"/>

    <meta property="og:title" content="{{ page.og_title | default: site.title }}" />
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}" />
    <meta http-equiv="cache-control" content="no-cache">
    <meta property="og:url" content="{{ page.og_url | default: site.homeurl | default: site.url }}" />
    <meta property="og:image" content="{% if page.og_image %}{{ page.og_image }}{% else %}{{ site.homeurl | default: site.url }}/{{ site.logo }}{% endif %}"/>
    <meta property="og:site_name" content="{{ page.og_site_name | default: site.name }}">
    <meta property="og:description" content="{{ page.og_description | default: site.description }}" />

    <link rel="icon" href="{{ site.baseurl }}/assets/images/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/assets/images/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/assets/images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/assets/images/favicon/favicon-16x16.png">

    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.name }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="{{ site.baseurl }}/assets/css/theme.css" rel="stylesheet">
    {% if site.google_analytics %}
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>
<body class="{% if page.layout %}layout-{{ page.layout }}{% endif %}{% if page.url == '/' or page.url == '' %} is-home{% endif %}">

<!-- Header -->
<header class="site-header" id="site-header">
    <div class="container">
        <div class="header-inner">
            <a href="{{ site.baseurl }}/" class="logo-link" aria-label="Home">
                <img src="{{ site.baseurl }}/{{ site.logo }}" alt="{{ site.name }}" class="logo-img">
            </a>
            <div class="header-right">
                <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
                    <span class="theme-icon theme-icon-dark" aria-hidden="true">☽</span>
                </button>
            </div>
        </div>
    </div>
</header>

<main class="site-content">
    {{ content }}
</main>

<!-- Footer -->
<footer class="site-footer">
    <div class="container">
        <p class="footer-text">© {{ site.time | date: "%Y" }}</p>
    </div>
</footer>

<script src="{{ site.baseurl }}/assets/js/theme.js"></script>
</body>
</html>
