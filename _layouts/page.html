---
layout: default
---

<section class="page-section page-content-with-hero">
  <div class="container">
    <h1 class="section-title">{{ page.title }}</h1>
    <div class="article-body" style="margin: 0 auto;">
      {{ content }}
    </div>
    {% if page.comments == true %}
    <div class="article-body" style="max-width: 720px; margin: 2rem auto 0;">
      {% include disqus.html %}
    </div>
    {% endif %}
  </div>
</section>
